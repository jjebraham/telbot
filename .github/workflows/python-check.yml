name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Compile Python sources
        run: python -m compileall -q .

      - name: Run tests
        run: python -m pytest -q

      - name: Check the bot module imports
        env:
          MAIN_BOT_TOKEN: "123456:CI"
          ADMIN_BOT_TOKEN: "654321:CI"
          DOTENV_PATH: /nonexistent
        run: python -c "import bot"

      - name: Validate Telegram Mini App types
        run: |
          python - <<'PY'
          from aiogram.types import KeyboardButton, MenuButtonWebApp, WebAppInfo

          web_app = WebAppInfo(url="https://example.com/miniapp")
          KeyboardButton(text="Open Mini App", web_app=web_app)
          MenuButtonWebApp(text="Mini App", web_app=web_app)
          print("Telegram Mini App types: OK")
          PY
